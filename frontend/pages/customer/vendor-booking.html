        }

        .nav-links {

            font-weight: 500;
        }

        .logout-btn {

            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            font-size: 42px;
        }

        .page-subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            font-size: 18px;
        }

        .service-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .service-tab {
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: white;
            font-size: 16px;
        }

        .service-tab.active {
            background: white;
            color: #6c63ff;
            border-color: white;
        }

        .service-tab:hover {
            background: white;
            color: #6c63ff;
            transform: translateY(-2px);
        }

        .vendor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .vendor-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .vendor-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .vendor-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .vendor-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .vendor-card:hover .vendor-image img {
            transform: scale(1.1);
        }

        .vendor-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #6c63ff;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .vendor-info {
            padding: 25px;
        }

        .vendor-info h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }

        .vendor-description {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .vendor-rating {
            margin: 10px 0;
            color: #ffc107;
            font-size: 14px;
        }

        .reviews {
            color: #999;
            font-size: 12px;
            margin-left: 5px;
        }

        .vendor-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .vendor-detail-item {
            text-align: center;
            flex: 1;
        }

        .vendor-detail-item i {
            color: #6c63ff;
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
        }

        .vendor-detail-item span {
            font-size: 12px;
            color: #666;
        }

        .vendor-price {
            font-size: 28px;
            color: #6c63ff;
            font-weight: bold;
            margin: 15px 0;
        }

        .vendor-price small {
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }

        .book-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.3s;

        .book-btn:hover {
            transform: translateY(-2px);

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            background: white;
            padding: 35px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 80px;

            <div class="payment-options">

                </label>

                </label>
            </div>
        </div>
        
        <button onclick="confirmBooking()" class="book-btn" style="margin-top: 15px;">✅ Confirm & Pay</button>

        function displayVendors(service) {
            const grid = document.getElementById('vendorsGrid');
            const vendorList = vendors[service] || [];

            if (vendorList.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: white;">No vendors available for this service.</p>';
                return;
            }

            grid.innerHTML = vendorList.map(vendor => `
                <div class="vendor-card">
                    <div class="vendor-image">
                        <img src="${vendor.image}" alt="${vendor.name}" onerror="this.src='https://via.placeholder.com/500x220?text=${encodeURIComponent(vendor.name)}'">
                        <div class="vendor-badge">⭐ ${vendor.rating}</div>
                    </div>
                    <div class="vendor-info">
                        <h3>${serviceEmoji[service]} ${vendor.name}</h3>
                        <div class="vendor-description">${vendor.description}</div>
                        <div class="vendor-rating">

        function openBookingModal(vendorId, service) {
            selectedVendor = vendors[service].find(v => v.id === vendorId);
            selectedVendor.service = service;
            document.getElementById('modalVendorName').innerHTML = `<strong>${selectedVendor.name}</strong><br>${serviceNames[service]} Service`;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('bookingDate').value = '';
            document.getElementById('specialRequests').value = '';
        }

        async function confirmBooking() {
    const bookingDate = document.getElementById('bookingDate').value;
    const specialRequests = document.getElementById('specialRequests').value;
    const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
    const token = localStorage.getItem('token');
    
    if (!bookingDate) {
        alert('Please select a booking date');
        return;
    }

    // For Cash on Delivery - Save directly without payment
    if (paymentMethod === 'cod') {

    const response = await fetch(
        'http://localhost:5000/api/bookings/create-vendor',
        {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                vendor_id: selectedVendor.id,
                vendor_name: selectedVendor.name,
                service_type: serviceNames[selectedVendor.service],
                booking_date: bookingDate,
                amount: selectedVendor.price,
                payment_method: 'cash',
                special_requests: specialRequests
            })
        }
    );

    const result = await response.json();

    if (response.ok) {
        alert('✅ Vendor booking submitted successfully');
        closeModal();
        window.location.href = 'my-bookings.html';
    } else {
        alert(result.message || 'Booking failed');
    }

    return;
}
    // For Online Payment - Proceed with Razorpay
    try {
        const orderResponse = await fetch('http://localhost:5000/api/payments/create-order', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                amount: selectedVendor.price,
                currency: 'INR',
                receipt: `vendor_booking_${Date.now()}`,
                notes: {
                    vendor_name: selectedVendor.name,
                    service_type: serviceNames[selectedVendor.service],
                    booking_date: bookingDate
                }
            })
        });
        
        const orderData = await orderResponse.json();
        
        if (!orderData.success) {
            throw new Error(orderData.message || 'Failed to create payment order');
        }
        
        const options = {
            key: orderData.key_id,
            amount: orderData.amount,
            currency: orderData.currency,
            name: 'EventSphere',
            description: `${serviceNames[selectedVendor.service]}: ${selectedVendor.name}`,
            order_id: orderData.order_id,
            handler: async function(response) {
                const verifyResponse = await fetch('http://localhost:5000/api/payments/verify-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature,
                    })
                });
                
                const verifyResult = await verifyResponse.json();
                
                if (verifyResult.success) {
                    const bookingResponse = await fetch(
    'http://localhost:5000/api/bookings/create-vendor',
    {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
            vendor_id: selectedVendor.id,
            vendor_name: selectedVendor.name,
            service_type: serviceNames[selectedVendor.service],
            booking_date: bookingDate,
            amount: selectedVendor.price,
            payment_method: 'online',
            special_requests: specialRequests
        })
    }
);

const bookingResult = await bookingResponse.json();

if (!bookingResponse.ok) {
    alert(bookingResult.message || 'Booking save failed');
    return;
}
                    
                    alert(`✅ Payment successful! "${selectedVendor.name}" is confirmed for ${bookingDate}!`);
                    closeModal();
                    window.location.href = 'my-bookings.html';
                } else {
                    alert('Payment verification failed. Please contact support.');
                }
            },
            prefill: {
                name: user.name,
                email: user.email,
            },
            theme: {
                color: '#6c63ff'
            }
        };
        
        const rzp = new Razorpay(options);
        rzp.open();
        
    } catch (error) {
        console.error('Payment error:', error);
        alert('Failed to initiate payment. Please try again. Error: ' + error.message);
    }
}

        displayVendors(currentService);

});

    if (event.target === modal) {
