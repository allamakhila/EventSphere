<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - EventSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-card { background: white; border-radius: 20px; padding: 50px; text-align: center; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .success-icon { font-size: 80px; color: #28a745; margin-bottom: 20px; }
        h1 { color: #28a745; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .payment-details { background: #f8f9fa; padding: 20px; border-radius: 12px; margin: 20px 0; text-align: left; }
        .payment-details p { margin: 10px 0; color: #333; }
        .btn-dashboard { background: #6c63ff; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.3s; }
        .btn-dashboard:hover { background: #5a52d5; transform: translateY(-2px); }
        .btn-bookings { background: transparent; color: #6c63ff; border: 2px solid #6c63ff; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-left: 10px; transition: all 0.3s; }
        .btn-bookings:hover { background: #6c63ff; color: white; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h1>Payment Successful! 🎉</h1>
        <p>Your booking has been confirmed successfully.</p>
        <div class="payment-details" id="paymentDetails">
            <p><strong>💰 Amount Paid:</strong> <span id="amount">₹0</span></p>
            <p><strong>📅 Booking Date:</strong> <span id="bookingDate">-</span></p>
            <p><strong>🏷️ Payment ID:</strong> <span id="paymentId">-</span></p>
            <p><strong>📧 Confirmation sent to:</strong> <span id="userEmail">-</span></p>
        </div>
        <div>
            <button class="btn-dashboard" onclick="goToDashboard()">Go to Dashboard</button>
            <button class="btn-bookings" onclick="goToBookings()">View My Bookings</button>
        </div>
    </div>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('amount').innerText = '₹' + (urlParams.get('amount') || '0');
        document.getElementById('bookingDate').innerText = urlParams.get('date') || new Date().toLocaleDateString();
        document.getElementById('paymentId').innerText = urlParams.get('payment_id') || 'PAY_' + Date.now();
        document.getElementById('userEmail').innerText = user.email || 'user@example.com';
        function goToDashboard() { window.location.href = 'dashboard.html'; }
        function goToBookings() { window.location.href = 'my-bookings.html'; }
    </script>
</body>
</html>
